[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vajranow"
version = "1.0.0"
description = "VajraNow: AI/ML Nowcasting of Thunderstorms and Lightning from Multiple Radars, Satellite, and Model Data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "PyYAML>=6,<7",
  "xarray>=2024.1,<2027",
  "torch>=2.0",
  "lightgbm>=4.0",
  "shap>=0.40",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.5,<1"]

[tool.setuptools.packages.find]
include = [
  "vajranow*",
  "eval*",
  "adapters*",
  "tracking*",
  "nowcast_baseline*",
  "models*",
  "calibration*",
  "alerts*",
  "risk*",
  "cap*",
  "replay*",
  "api*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
